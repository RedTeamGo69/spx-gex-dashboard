name: Forward Test Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'range_finder/**'
      - 'phase1/**'
      - 'ui_forward_test.py'
      - 'ui_spread_finder.py'
      - 'ui_theme.py'
      - 'tests/**'
      - 'scripts/demo_forward_test.py'
      - 'scripts/view_forward_test_fixture.py'
      - 'scripts/check_forward_test_prerequisites.py'
      - 'requirements.txt'
      - 'streamlit_app.py'
      - 'forward_test.py'
      - 'migrations/**'
      - '.github/workflows/forward_test*.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: gammalens_forward_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d gammalens_forward_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          FORWARD_TEST_TEST_DATABASE_URL: postgresql://fixture:fixture_only@127.0.0.1:5432/gammalens_forward_test
