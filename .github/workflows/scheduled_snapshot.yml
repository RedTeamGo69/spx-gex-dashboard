name: Scheduled GEX Snapshot

on:
  # PRIMARY: triggered externally by cron-job.org at 9:28 AM ET (Mon-Fri),
  # two minutes before the bell. The early fire gives the Actions runner
  # time to boot + pip install so Python is already running pre-open work
  # (FRED rate and expirations) during the idle window;
  # scheduled_snapshot.py then parks in its wait loop until 9:30:00 ET
  # before fetching spot + chains. cron-job.org handles DST automatically
  # via America/New_York. Can also be triggered manually from the UI.
  #
  # BACKUP (dead-man's switch): the schedule pair below. GitHub cron is UTC
  # and does NOT shift with US DST, so each entry lands at ~9:45 ET in one
  # DST half and ~8:45/10:45 ET in the other — the out-of-window fire exits
  # green at the script's 9:20-10:15 ET window guard in seconds. When the
  # primary already ran, the in-window backup hits the already-captured
  # guard (em_snapshots row exists) and exits green without touching
  # Tradier. When cron-job.org silently dies (expired PAT, account lapse,
  # outage), NO run would otherwise exist — GitHub failure e-mails only
  # fire for runs that exist — so the backup both performs the capture
  # (~15 min late, from real daily-open bars where it matters) and restores
  # failure notifications.
  schedule:
    - cron: "45 13 * * 1-5"   # 9:45 ET during EDT (Mar-Nov)
    - cron: "45 14 * * 1-5"   # 9:45 ET during EST (Nov-Mar)
  workflow_dispatch:
    inputs:
      force_weekly_setup:
        description: "Force weekly spread finder rebuild (refit HAR, even on non-Monday). Use after a DB wipe or to refresh after a code change."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Index / ETF defaults + single-name defaults. Single names resolve
        # through ticker_config's dynamic-config path (own-HAR, VIX vol proxy).
        # Cadence differs by type: index/ETF run daily (GEX/EM); single names
        # (stock category) run weekly-only on the week's first trading day —
        # see the cadence gate in scheduled_snapshot.py. The weekly HAR fit
        # fires Mondays for all.
        ticker: [SPX, XSP, SPY, QQQ, NDX, NVDA, JPM, CAT]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled snapshot (${{ matrix.ticker }})
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TICKER: ${{ matrix.ticker }}
          FORCE_WEEKLY_SETUP: ${{ inputs.force_weekly_setup || 'false' }}
        run: python scheduled_snapshot.py
